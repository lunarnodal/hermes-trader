services:

  # ─── OpenClaw Gateway ─────────────────────────────────────────
  openclaw:
    image: openclaw/openclaw:latest
    container_name: openclaw-gateway
    restart: unless-stopped
    network_mode: host
    volumes:
      # Persist OpenClaw config and agent workspace
      - /home/trading/.openclaw:/root/.openclaw
      # Mount repo skills and personas into container
      - /home/trading/trading-ai/openclaw/skills:/root/.openclaw/skills
      - /home/trading/trading-ai/openclaw/personas:/root/.openclaw/personas
      # QNAP timeseries for memory and logs
      - /mnt/qnap/timeseries:/mnt/timeseries
    environment:
      - OPENCLAW_GATEWAY_PORT=18789
      - OPENCLAW_OLLAMA_URL=http://127.0.0.1:11434
    command: gateway run
    depends_on:
      - qdrant

  # ─── Qdrant Vector Store ───────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"    # REST API
      - "6334:6334"    # gRPC
    volumes:
      # Persist vector store on QNAP
      - /mnt/qnap/vectorstore/qdrant:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334

  # ─── Feed Scheduler ───────────────────────────────────────────
  scheduler:
    image: alpine:latest
    container_name: feed-scheduler
    restart: unless-stopped
    volumes:
      - /home/trading/trading-ai/pipeline:/pipeline
      - /mnt/qnap/timeseries:/mnt/timeseries
      - /mnt/qnap/raw-feeds:/mnt/raw-feeds
    entrypoint: /bin/sh -c "apk add --no-cache curl python3 py3-pip && crond -f -l 2"
    depends_on:
      - openclaw

