services:
  # ─── Qdrant Vector Store ───────────────────────────────────────
  # Restored 2026-10-09 (Rem OPS-3 / t_b03fe213): compose files were removed in
  # 7c00dab but the qdrant container was still running from the old path.
  # Image pinned to the running version; healthcheck is a bind-mounted script
  # because the qdrant image has neither curl nor wget (dash sh lacks /dev/tcp).
  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - /var/lib/qdrant/storage:/qdrant/storage
      - /var/lib/qdrant/snapshots:/qdrant/snapshots
      - ./qdrant-healthcheck.sh:/tmp/qdrant-healthcheck.sh:ro
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD-SHELL", "bash /tmp/qdrant-healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
